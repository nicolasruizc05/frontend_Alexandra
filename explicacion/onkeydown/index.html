<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onkeydown</title>
</head>
<body>
    <h1>Captura de profesion</h1>
    <label for="profesion">Escribe tu profesion: </label>
    <input type="text" id="profesion" onkeydown="capturartecla()" placeholder="Ejemplo: programador ">
    <h3>Contenido Capturado</h3>
    <p id="resultado"></p>
    <script src="index.js"></script>
</body>
</html>
