<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h2>Registro de Usuario</h2>
    <label for="nombre">Escriba su nombre</label>
    <input type="text" id="nombre" placeholder="Escribir Nombre"> <br><br>
    <label for="apellido">Escriba su apellido</label>
    <input type="text" id="apellido" placeholder="Escribir Apellido"> <br><br>
    <label for="direccion">Escriba su dirección</label>
    <input type="tel" id="direc" placeholder="Escribir Dirección"> <br><br>
    <label for="telefono">Escriba su numero de telefono</label>
    <input type="text" id="tel" placeholder="Escribir Telefono"> <br><br>
    <label for="correo">Escriba su Correo Electronico</label>
    <input type="email" id="correo" placeholder="Escribir Email"> <br><br>
    <label for="contraseña">Escriba su Contraseña</label>
    <input type="password" id="contra" placeholder="Escribir Contraseña"> <br><br>
    <button onclick="guardar()">Guardar</button>

    <script src="registro.js"></script>
</body>
</html>
