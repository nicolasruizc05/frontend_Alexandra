<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="registro">
        <label for="nombre">Ingrese su nombre</label>
        <input type="text" id="nombre"> <br>
        <label for="apellido">Ingrese su apellido</label>
        <input type="text" id="apellido"> <br>
        <label for="direccion">Ingrese su dirección</label>
        <input type="text" id="direccion"> <br>
        <label for="telefono">Ingrese su numero de telefono</label>
        <input type="tel" id="telefono"> <br>
        <label for="contraseña">Ingrese su contraseña</label>
        <input type="password" id="contraseña"> <br>
        <button onclick="guardar()">Registrarse</button>
        <button onclick="ver()">Ver</button>
    </form>
    <script src="index.js"></script>
</body>
